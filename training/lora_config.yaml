# LoRA / QLoRA configuration for finetune_lora.py
# Consumed as plain text by the training script (no YAML dependency in core).

base_model: "codellama/CodeLlama-7b-Instruct-hf"  # any HF code model works
dataset: "training/data/train.jsonl"
output_dir: "training/output/code-assistant-lora"

# QLoRA: 4-bit quantised base + LoRA adapters
load_in_4bit: true
bnb_4bit_quant_type: "nf4"

# LoRA hyperparameters
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

# Training hyperparameters
num_train_epochs: 3
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 0.0002
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
max_seq_length: 2048
logging_steps: 10
save_strategy: "epoch"
